<text x="496" y="340" font-size="15" font-weight="800" fill="#f1f5f9">Normalizasyon · özellik v1</text>
<text x="496" y="366" font-size="13" fill="#cbd5e1">1. Bilek (0) orijine taşınır</text>
<text x="496" y="388" font-size="13" fill="#cbd5e1">2. Hepsi |0 → 9| uzunluğuna bölünür</text>
<text x="496" y="410" font-size="13" fill="#cbd5e1">3. Döndürme normalize EDİLMEZ</text>
<text x="496" y="432" font-size="13" fill="#cbd5e1">   (sol/sağ bilgisi yönde saklı)</text>
<text x="496" y="454" font-size="13" fill="#cbd5e1">4. Düzleştir → 63 özellik</text>
