  <rect x="200" y="262" width="200" height="164" rx="6" fill="#b45309" fill-opacity="0.55" stroke="#d97706" stroke-width="2"/>
  <rect x="200" y="262" width="200" height="164" rx="6" fill="url(#holes)"/>

  <!-- ESP32 -->
  <rect x="212" y="274" width="112" height="66" rx="4" fill="#1f2937" stroke="#60a5fa" stroke-width="2"/>
  <rect x="220" y="281" width="48" height="52" rx="2" fill="#cbd5e1"/>
