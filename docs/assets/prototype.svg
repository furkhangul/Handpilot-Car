  <text x="294" y="490" font-size="11" font-weight="700" text-anchor="middle" fill="#f0fdf4">Ni-MH 1300 mAh</text>
  <text x="294" y="513" font-size="11" font-weight="700" text-anchor="middle" fill="#f0fdf4">4 × 1.2 V = 4.8 V</text>

