  <g stroke-width="2.5" fill="none">
    <path d="M324 284 H334" stroke="#f59e0b"/><path d="M324 292 H334" stroke="#38bdf8"/>
    <path d="M324 300 H334" stroke="#38bdf8"/><path d="M324 312 H334" stroke="#f59e0b"/>
