  <rect x="166" y="300" width="28" height="92" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="180" y="350" font-size="11" font-weight="800" text-anchor="middle" fill="#e2e8f0" transform="rotate(-90 180 346)">5V PB</text>
  <path d="M194 380 H293 V348" stroke="#e2e8f0" stroke-width="2.5" fill="none"/>

