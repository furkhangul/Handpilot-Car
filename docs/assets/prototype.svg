    <rect x="207" y="454" width="174" height="18" rx="6" fill="#16a34a"/><rect x="381" y="458" width="8" height="10" rx="2" fill="#cbd5e1"/>
    <rect x="207" y="477" width="174" height="18" rx="6" fill="#16a34a"/><rect x="381" y="481" width="8" height="10" rx="2" fill="#cbd5e1"/>
    <rect x="207" y="500" width="174" height="18" rx="6" fill="#16a34a"/><rect x="381" y="504" width="8" height="10" rx="2" fill="#cbd5e1"/>
