<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="holes" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#78350f" fill-opacity="0.8"/>
    </pattern>
    <pattern id="tread" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#111827"/>
      <rect y="0" width="10" height="4" fill="#374151"/>
    </pattern>
    <g id="badge-style"/>
  </defs>

  <rect width="1200" height="690" rx="22" fill="#0b1220"/>
  <text x="30" y="46" font-size="24" font-weight="800" fill="#f1f5f9">HandPilot-Car · Prototip (konsept çizim)</text>
  <text x="30" y="72" font-size="14" fill="#94a3b8">2WD şasi · ESP32-WROOM-32D · TB6612FNG · 4×AA Ni-MH · ölçekli değildir</text>

  <!-- ================= ÜSTTEN GÖRÜNÜM ================= -->
  <text x="300" y="104" font-size="15" font-weight="700" text-anchor="middle" fill="#cbd5e1">Üstten görünüm</text>
  <text x="300" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#fbbf24">▲ ÖN</text>

  <!-- Şasi (akrilik) -->
  <rect x="160" y="136" width="280" height="460" rx="46" fill="#93c5fd" fill-opacity="0.10" stroke="#93c5fd" stroke-width="2.5"/>
  <g fill="#0b1220" stroke="#93c5fd" stroke-opacity="0.5">
    <circle cx="190" cy="168" r="4"/><circle cx="410" cy="168" r="4"/>
    <circle cx="190" cy="565" r="4"/><circle cx="410" cy="565" r="4"/>
  </g>

  <!-- Tekerlekler -->
  <rect x="110" y="160" width="44" height="126" rx="10" fill="url(#tread)" stroke="#64748b" stroke-width="2"/>
  <rect x="446" y="160" width="44" height="126" rx="10" fill="url(#tread)" stroke="#64748b" stroke-width="2"/>

