  <text x="986" y="181" font-size="10" font-weight="800" text-anchor="middle" fill="#93c5fd">ESP32</text>
  <rect x="1016" y="172" width="38" height="16" rx="3" fill="#6d28d9" stroke="#c4b5fd" stroke-width="1.5"/>
