  <rect x="160" y="198" width="92" height="48" rx="6" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <rect x="348" y="198" width="92" height="48" rx="6" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <text x="206" y="227" font-size="13" font-weight="700" text-anchor="middle" fill="#713f12">TT motor</text>
  <text x="394" y="227" font-size="13" font-weight="700" text-anchor="middle" fill="#713f12">TT motor</text>
  <!-- 100 nF motor uçlarında -->
  <rect x="246" y="214" width="10" height="16" rx="3" fill="#f97316"/>
  <rect x="344" y="214" width="10" height="16" rx="3" fill="#f97316"/>

