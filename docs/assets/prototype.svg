      <text x="684" y="450"><tspan font-weight="700">TB6612FNG</tspan> · 2 kanal sürücü</text>
      <text x="684" y="482"><tspan font-weight="700">4×AA Ni-MH</tspan> · 1300 mAh</text>
      <text x="684" y="514"><tspan font-weight="700">2 A cam sigorta</tspan> · kısa devre</text>
      <text x="684" y="546"><tspan font-weight="700">IC205 kayar anahtar</tspan></text>
      <text x="684" y="578"><tspan font-weight="700">TT DC motor ×2</tspan> + 100 nF</text>
      <text x="944" y="418"><tspan font-weight="700">Tekerlek ×2</tspan></text>
