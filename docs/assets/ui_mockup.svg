<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#1f242d"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="600" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Kamera görüntüsü (temsili oda) -->
    <rect width="960" height="600" fill="url(#room)"/>
    <rect x="70" y="60" width="150" height="330" rx="4" fill="#2a303b"/>
    <rect x="760" y="110" width="140" height="100" rx="4" fill="#465063" fill-opacity="0.5"/>
    <rect x="0" y="470" width="960" height="130" fill="#1a1e26"/>
    <!-- sürücü silueti -->
    <ellipse cx="600" cy="230" rx="70" ry="86" fill="#141820" fill-opacity="0.85"/>
    <path d="M440 600 C450 400 520 330 600 330 C680 330 750 400 760 600 Z" fill="#141820" fill-opacity="0.85"/>

    <!-- El kutusu + iskelet (yumruk) -->
    <rect x="378" y="250" width="170" height="190" rx="8" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 5"/>
    <g stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none">
      <polyline points="462,420 430,400 412,372 420,346 444,336"/>
      <polyline points="462,420 420,318 428,290 446,296 448,320"/>
      <polyline points="420,318 452,310 484,314 512,326 462,420"/>
      <polyline points="452,310 458,280 474,286 474,312"/>
      <polyline points="484,314 492,286 506,294 504,318"/>
      <polyline points="512,326 522,302 532,312 528,334"/>
    </g>
    <g fill="#bbf7d0">
      <circle cx="462" cy="420" r="5"/><circle cx="430" cy="400" r="4.5"/><circle cx="412" cy="372" r="4.5"/><circle cx="420" cy="346" r="4.5"/><circle cx="444" cy="336" r="4.5"/>
      <circle cx="420" cy="318" r="4.5"/><circle cx="428" cy="290" r="4.5"/><circle cx="446" cy="296" r="4.5"/><circle cx="448" cy="320" r="4.5"/>
      <circle cx="452" cy="310" r="4.5"/><circle cx="458" cy="280" r="4.5"/><circle cx="474" cy="286" r="4.5"/><circle cx="474" cy="312" r="4.5"/>
      <circle cx="484" cy="314" r="4.5"/><circle cx="492" cy="286" r="4.5"/><circle cx="506" cy="294" r="4.5"/><circle cx="504" cy="318" r="4.5"/>
      <circle cx="512" cy="326" r="4.5"/><circle cx="522" cy="302" r="4.5"/><circle cx="532" cy="312" r="4.5"/><circle cx="528" cy="334" r="4.5"/>
    </g>
    <text x="382" y="244" font-size="14" font-weight="700" fill="#4ade80">gaz 0.93 · kural OK</text>

    <!-- Sol üst: büyük komut -->
    <rect x="20" y="20" width="300" height="130" rx="14" fill="#000" fill-opacity="0.55"/>
    <text x="40" y="96" font-size="72" font-weight="900" fill="#22c55e">GAZ</text>
    <text x="42" y="132" font-size="20" font-weight="700" fill="#e2e8f0">GIDIYOR · DUZ</text>
    <circle cx="290" cy="46" r="9" fill="#22c55e"/>

    <!-- Sağ üst: bağlantı ve FPS -->
    <rect x="690" y="20" width="250" height="100" rx="14" fill="#000" fill-opacity="0.55"/>
    <circle cx="714" cy="50" r="8" fill="#22c55e"/>
    <text x="732" y="56" font-size="18" font-weight="700" fill="#e2e8f0">WiFi  18 ms</text>
    <text x="710" y="84" font-size="16" fill="#cbd5e1">FPS  29.7</text>
    <text x="710" y="106" font-size="14" fill="#94a3b8">seq 812 · heartbeat 300 ms</text>

    <!-- Sol alt: güven çubuğu -->
    <rect x="20" y="470" width="360" height="74" rx="14" fill="#000" fill-opacity="0.55"/>
    <text x="38" y="496" font-size="15" font-weight="700" fill="#e2e8f0">guven</text>
    <rect x="100" y="483" width="260" height="18" rx="9" fill="#334155"/>
    <rect x="100" y="483" width="242" height="18" rx="9" fill="#22c55e"/>
    <line x1="321" y1="477" x2="321" y2="507" stroke="#fde68a" stroke-width="3"/>
    <text x="321" y="522" font-size="12" text-anchor="middle" fill="#fde68a">0.85</text>
    <text x="38" y="530" font-size="14" fill="#cbd5e1">onay</text>
    <g fill="#22c55e"><circle cx="110" cy="526" r="6"/><circle cx="128" cy="526" r="6"/><circle cx="146" cy="526" r="6"/><circle cx="164" cy="526" r="6"/><circle cx="182" cy="526" r="6"/></g>
    <text x="196" y="531" font-size="13" fill="#94a3b8">5/5 kare</text>

    <!-- Alt: yardım satırı (cv2.putText ASCII) -->
    <rect x="0" y="560" width="960" height="40" fill="#000" fill-opacity="0.65"/>
    <text x="480" y="586" font-size="15" text-anchor="middle" fill="#cbd5e1">YUMRUK gaz   |   ACIK EL fren   |   BASPARMAK SOL / SAG yon   |   Q cik</text>
  </g>
  <rect x="1" y="1" width="958" height="598" rx="21" fill="none" stroke="#334155" stroke-width="2"/>
</svg>
