<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="600" rx="18"/></clipPath>
    <g id="fist" fill="#e8b48c" stroke="#9a6b47" stroke-width="2">
      <rect x="-28" y="40" width="56" height="70" rx="10"/>
      <rect x="-50" y="-20" width="100" height="74" rx="24"/>
      <rect x="-50" y="-54" width="25" height="60" rx="12"/>
      <rect x="-25" y="-58" width="25" height="64" rx="12"/>
      <rect x="0"   y="-56" width="25" height="62" rx="12"/>
      <rect x="25"  y="-50" width="25" height="56" rx="12"/>
      <rect x="-56" y="6" width="80" height="25" rx="12" transform="rotate(-10)"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="600" fill="url(#room)"/>
    <ellipse cx="300" cy="250" rx="80" ry="100" fill="#1f2937" fill-opacity="0.7"/>
    <path d="M120 600 C140 420 210 360 300 360 C390 360 460 420 480 600 Z" fill="#1f2937" fill-opacity="0.7"/>
    <use href="#fist" transform="translate(400 300) scale(1.1)"/>

    <!-- üst bilgi şeridi -->
    <rect width="800" height="78" fill="#000" fill-opacity="0.6"/>
    <text x="26" y="40" font-size="24" font-weight="700" fill="#f0d228">GAZ = YUMRUK</text>
    <text x="26" y="64" font-size="15" fill="#bebebe">Kisi p01  |  127/300 foto  |  Tur 5/10  |  bu tur 7/30</text>

    <!-- son kaydedilen fotoğraf -->
    <rect x="572" y="88" width="200" height="150" fill="url(#room)" stroke="#50dc50" stroke-width="3"/>
    <use href="#fist" transform="translate(684 168) scale(0.55)"/>
    <text x="572" y="258" font-size="13" fill="#50dc50">Son kayit:</text>
    <text x="572" y="278" font-size="13" fill="#50dc50">k3x9q2ma.jpg</text>

    <!-- alt ipuçları -->
    <rect y="410" width="800" height="190" fill="#000" fill-opacity="0.6"/>
    <text x="26" y="442" font-size="15" fill="#fff">- 4 parmak avuca kapali, basparmak parmaklarin USTUNDE</text>
    <text x="26" y="475" font-size="15" fill="#fff">- Basparmagi avucun ICINE sokma, YANA da cikarma</text>
    <text x="26" y="507" font-size="15" fill="#fff">- Parmak bogumlari kameraya baksin, bilek duz</text>
    <text x="26" y="540" font-size="15" fill="#f0d228">Bu tur: Eli ekranda yavasca gezdir: yukari-asagi</text>
    <text x="26" y="574" font-size="13" fill="#bebebe">P: duraklat   R: turu bastan al   S: hareketi atla   Q: kaydet ve cik</text>
  </g>
  <!-- kayıt anı: yeşil çerçeve -->
  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#50dc50" stroke-width="12"/>
</svg>
