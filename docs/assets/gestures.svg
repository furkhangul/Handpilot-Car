<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Yumruk: 4 parmak kapalı, başparmak parmakların üstünde -->
    <g id="fist" fill="#f5c9a0" stroke="#b07a4f" stroke-width="2.5">
      <rect x="-28" y="40" width="56" height="46" rx="10"/>
      <rect x="-50" y="-20" width="100" height="74" rx="24"/>
      <rect x="-50" y="-54" width="25" height="60" rx="12"/>
      <rect x="-25" y="-58" width="25" height="64" rx="12"/>
      <rect x="0"   y="-56" width="25" height="62" rx="12"/>
      <rect x="25"  y="-50" width="25" height="56" rx="12"/>
      <rect x="-56" y="6" width="80" height="25" rx="12" transform="rotate(-10)"/>
    </g>
    <!-- Yumruk + başparmak yana (sola). Sağ için yatay aynalanır. -->
    <g id="thumbSide" fill="#f5c9a0" stroke="#b07a4f" stroke-width="2.5">
      <rect x="-28" y="40" width="56" height="46" rx="10"/>
      <rect x="-114" y="-4" width="84" height="25" rx="12"/>
      <rect x="-108" y="0" width="14" height="17" rx="5" fill="#fde4cf" stroke-width="1.5"/>
      <rect x="-50" y="-20" width="100" height="74" rx="24"/>
      <rect x="-50" y="-54" width="25" height="60" rx="12"/>
      <rect x="-25" y="-58" width="25" height="64" rx="12"/>
      <rect x="0"   y="-56" width="25" height="62" rx="12"/>
      <rect x="25"  y="-50" width="25" height="56" rx="12"/>
    </g>
    <!-- Açık avuç -->
    <g id="palm" fill="#f5c9a0" stroke="#b07a4f" stroke-width="2.5">
      <rect x="-26" y="52" width="52" height="40" rx="10"/>
      <rect x="-46" y="-90" width="20" height="96" rx="10" transform="rotate(-8 -36 0)"/>
      <rect x="-20" y="-104" width="20" height="108" rx="10" transform="rotate(-2 -10 0)"/>
      <rect x="5"   y="-98" width="20" height="102" rx="10" transform="rotate(3 15 0)"/>
      <rect x="28"  y="-74" width="18" height="80" rx="9" transform="rotate(10 37 0)"/>
      <rect x="-100" y="-4" width="62" height="22" rx="11" transform="rotate(-38 -44 8)"/>
      <rect x="-48" y="-18" width="96" height="78" rx="24"/>
    </g>
    <!-- Diğer: örnek olarak iki parmak (V) -->
    <g id="other" fill="#f5c9a0" stroke="#b07a4f" stroke-width="2.5">
      <rect x="-28" y="40" width="56" height="46" rx="10"/>
      <rect x="-44" y="-98" width="20" height="100" rx="10" transform="rotate(-14 -34 0)"/>
      <rect x="-14" y="-104" width="20" height="106" rx="10" transform="rotate(8 -4 0)"/>
      <rect x="-50" y="-20" width="100" height="74" rx="24"/>
      <rect x="4"  y="-46" width="23" height="52" rx="11"/>
      <rect x="27" y="-40" width="23" height="46" rx="11"/>
      <rect x="-50" y="8" width="70" height="24" rx="12" transform="rotate(-12)"/>
    </g>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="10" refY="10" orient="auto">
      <path d="M0 0 L20 10 L0 20 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="450" rx="22" fill="#0b1220"/>

  <!-- 1 · GAZ -->
  <g transform="translate(20 20)">
    <rect width="220" height="410" rx="18" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h184 a18 18 0 0 1 18 18 v38 h-220 z" fill="#22c55e"/>
    <text x="110" y="38" font-size="22" font-weight="800" text-anchor="middle" fill="#052e16">GAZ</text>
    <use href="#fist" transform="translate(110 185)"/>
    <text x="110" y="310" font-size="18" font-weight="700" text-anchor="middle" fill="#f1f5f9">Yumruk</text>
    <text x="110" y="334" font-size="12" text-anchor="middle" fill="#94a3b8">Başparmak parmakların ÜSTÜNDE</text>
    <text x="110" y="352" font-size="13" text-anchor="middle" fill="#94a3b8">Mandallı: açık ele kadar gider</text>
    <rect x="20" y="368" width="180" height="26" rx="13" fill="#14532d"/>
    <text x="110" y="386" font-size="12" font-weight="600" text-anchor="middle" fill="#bbf7d0">gaz · 5 kare · güven ≥ 0.85</text>
  </g>

  <!-- 2 · FREN -->
  <g transform="translate(256 20)">
    <rect width="220" height="410" rx="18" fill="#111827" stroke="#ef4444" stroke-width="2"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h184 a18 18 0 0 1 18 18 v38 h-220 z" fill="#ef4444"/>
    <text x="110" y="38" font-size="22" font-weight="800" text-anchor="middle" fill="#450a0a">FREN</text>
    <use href="#palm" transform="translate(110 178) scale(0.92)"/>
    <text x="110" y="310" font-size="18" font-weight="700" text-anchor="middle" fill="#f1f5f9">Açık avuç</text>
    <text x="110" y="334" font-size="13" text-anchor="middle" fill="#94a3b8">5 parmak açık ve aralıklı</text>
    <text x="110" y="352" font-size="13" text-anchor="middle" fill="#94a3b8">Her zaman kazanır</text>
    <rect x="20" y="368" width="180" height="26" rx="13" fill="#7f1d1d"/>
    <text x="110" y="386" font-size="12" font-weight="600" text-anchor="middle" fill="#fecaca">fren · 2 kare · güven ≥ 0.60</text>
  </g>

  <!-- 3 · SOL -->
  <g transform="translate(492 20)">
    <rect width="220" height="410" rx="18" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h184 a18 18 0 0 1 18 18 v38 h-220 z" fill="#3b82f6"/>
    <text x="110" y="38" font-size="22" font-weight="800" text-anchor="middle" fill="#0c1a3d">SOL</text>
    <use href="#thumbSide" transform="translate(140 190)"/>
    <line x1="150" y1="95" x2="40" y2="95" stroke="#60a5fa" stroke-width="4" marker-end="url(#arr)"/>
    <text x="110" y="310" font-size="18" font-weight="700" text-anchor="middle" fill="#f1f5f9">Başparmak sola</text>
    <text x="110" y="334" font-size="13" text-anchor="middle" fill="#94a3b8">Yumruk, başparmak YATAY</text>
    <text x="110" y="352" font-size="13" text-anchor="middle" fill="#94a3b8">Yataydan sapma ≤ 35°</text>
    <rect x="20" y="368" width="180" height="26" rx="13" fill="#1e3a8a"/>
    <text x="110" y="386" font-size="12" font-weight="600" text-anchor="middle" fill="#bfdbfe">sol · 3 kare · güven ≥ 0.75</text>
  </g>

  <!-- 4 · SAĞ -->
  <g transform="translate(728 20)">
    <rect width="220" height="410" rx="18" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h184 a18 18 0 0 1 18 18 v38 h-220 z" fill="#3b82f6"/>
    <text x="110" y="38" font-size="22" font-weight="800" text-anchor="middle" fill="#0c1a3d">SAĞ</text>
    <use href="#thumbSide" transform="translate(80 190) scale(-1 1)"/>
    <line x1="70" y1="95" x2="180" y2="95" stroke="#60a5fa" stroke-width="4" marker-end="url(#arr)"/>
    <text x="110" y="310" font-size="18" font-weight="700" text-anchor="middle" fill="#f1f5f9">Başparmak sağa</text>
    <text x="110" y="334" font-size="13" text-anchor="middle" fill="#94a3b8">Yumruk, başparmak YATAY</text>
    <text x="110" y="352" font-size="13" text-anchor="middle" fill="#94a3b8">Yalnızca araç giderken</text>
    <rect x="20" y="368" width="180" height="26" rx="13" fill="#1e3a8a"/>
    <text x="110" y="386" font-size="12" font-weight="600" text-anchor="middle" fill="#bfdbfe">sag · 3 kare · güven ≥ 0.75</text>
  </g>

  <!-- 5 · DİĞER -->
  <g transform="translate(964 20)">
    <rect width="216" height="410" rx="18" fill="#111827" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h180 a18 18 0 0 1 18 18 v38 h-216 z" fill="#475569"/>
    <text x="108" y="38" font-size="22" font-weight="800" text-anchor="middle" fill="#f1f5f9">DİĞER</text>
    <g opacity="0.75"><use href="#other" transform="translate(108 190) scale(0.95)"/></g>
    <text x="108" y="310" font-size="18" font-weight="700" text-anchor="middle" fill="#f1f5f9">Hiçbiri</text>
    <text x="108" y="334" font-size="13" text-anchor="middle" fill="#94a3b8">Yarı açık el, OK, 2 parmak…</text>
    <text x="108" y="352" font-size="13" text-anchor="middle" fill="#94a3b8">Son komut korunur, 1 sn → DUR</text>
    <rect x="18" y="368" width="180" height="26" rx="13" fill="#334155"/>
    <text x="108" y="386" font-size="12" font-weight="600" text-anchor="middle" fill="#e2e8f0">diger · bilinçli olarak öğrenilir</text>
  </g>
</svg>
